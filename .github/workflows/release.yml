# GitHub Actions 自动发版（可选）
# 说明：本工作流在推送 v* 标签时自动构建 zip 并发布到 Releases。
# 由于 PyInstaller 打包需 Windows 环境，此工作流使用 windows-latest runner。
# 用法：git tag v2.4.4 && git push origin v2.4.4
# 注意：仓库需在 Settings -> Actions 中启用工作流；secrets 无需额外配置。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Windows runner 默认 stdout 编码（cp1252）无法打印脚本中的中文提示
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller pypinyin

      - name: 生成数据与资源版本
        run: |
          python sjtu-link/tools/enrich_data.py
          python sjtu-link/tools/sync_assets.py

      - name: 运行测试
        run: |
          node sjtu-link/tools/test_search_core.js
          node sjtu-link/tools/test_search_realdata.js
          node sjtu-link/tools/test_disclaimer.js
          node sjtu-link/tools/test_favorites.js
          node sjtu-link/tools/test_settings.js
          node sjtu-link/tools/test_countdown.js

      - name: 打包单文件 exe
        run: |
          python -m PyInstaller --noconsole --onefile --name Jiaowodao sjtu-link/launcher.py

      - name: 组装 zip
        shell: pwsh
        run: |
          $stage = '_zip_stage'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Recurse -Force 'sjtu-link' "$stage\sjtu-link"
          Copy-Item -Force 'install-jiaowodao.ps1','安装交我导.cmd','安装指南.md','安装指南.txt','CHANGELOG.md' $stage
          Copy-Item -Force 'dist\Jiaowodao.exe' "$stage\sjtu-link\Jiaowodao.exe"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          # 仓库目录内的中文名 zip 由维护者随版本提交更新（CreateFromDirectory 不允许覆盖，故不在此生成同名文件）；
          # Release 附件用 ASCII 名：GitHub 上传接口会剥离非 ASCII 字符（中文名会变成 "-.zip"）
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage, "jiaowodao-desktop-${{ github.ref_name }}.zip", [System.IO.Compression.CompressionLevel]::Optimal, $false, [System.Text.Encoding]::UTF8)

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: jiaowodao-desktop-${{ github.ref_name }}.zip
          generate_release_notes: true
